name: bench-git

# Git clone memory benchmark (TEST-07) — MANUAL ONLY.
#
# Generating the deterministic ~1.3 GB fixture and cloning it per-backend
# takes ~15-40 min, which is too slow to run on every push. It is non-gating
# coverage, so it runs on demand via the Actions "Run workflow" button (or
# `gh workflow run bench-git.yml`). Run it before a release or when touching
# the git serving path.
#
# The bench enforces a hard gate (peak_rss < 3 * repo_bytes for the gogit
# backend) and archives .bench/git-results.json. Unlike the old in-CI job it
# is NOT continue-on-error: a manual run should surface the real verdict.

on:
  workflow_dispatch:

jobs:
  bench-git:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        run: make frontend

      - name: Install git
        run: sudo apt-get update && sudo apt-get install -y git

      - name: Run git memory bench (TEST-07)
        run: make bench-git

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: git-bench-results
          path: .bench/git-results.json
