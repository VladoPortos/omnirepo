# CodeQL — GitHub-native SAST (static analysis security testing).
#
# Catches: SQL injection, path traversal, hardcoded credentials, insecure
# crypto, command injection, XSS, prototype pollution, eval-on-user-input,
# and language-specific bug patterns. Findings show up in the repo's
# Security tab and as PR annotations.
#
# Two analyses run in parallel:
#   - go                       — covers cmd/, internal/, pkg/, test/
#   - javascript-typescript    — covers the React + TS frontend in web/
#
# Uses GitHub's "security-and-quality" query suite (broader than default
# — catches lower-severity-but-real issues too).
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly Monday 03:00 UTC — picks up new CodeQL queries against the
    # current main even when no commits land.
    - cron: "0 3 * * 1"

# Default deny — any job without an explicit permissions: block runs with
# the GITHUB_TOKEN restricted to read-only contents access. Per-job
# permissions below opt back into the additional scopes they actually need
# (security-events: write for SARIF upload, etc.).
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # setup-go is needed for the Go matrix entry so autobuild's
      # `go build ./...` runs on the project's pinned toolchain (1.25)
      # against the vendored deps. Harmless no-op for the JS matrix entry.
      - name: Setup Go
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
          cache: false

      # Build the React frontend first so `//go:embed dist/*` in
      # web/embed.go finds the bundle when CodeQL extracts Go.
      - uses: actions/setup-node@v4
        if: matrix.language == 'go' || matrix.language == 'javascript-typescript'
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build frontend (so go:embed dist/* resolves)
        run: cd web && npm ci --no-audit --no-fund && npm run build

      - name: Initialize CodeQL
        uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality

      # Autobuild handles Go (`go build ./...`). For the JS matrix entry
      # build-mode is "none" — CodeQL extracts directly from source.
      - name: Autobuild
        if: matrix.build-mode == 'autobuild'
        uses: github/codeql-action/autobuild@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          category: /language:${{ matrix.language }}
          # GitHub Advanced Security (Code Scanning alerts) is paid for
          # private repos. With it off, the upload step 403s with
          # "Code scanning is not enabled for this repository" and the
          # whole job goes red even though the analysis succeeded.
          # Save SARIF as a downloadable artifact instead. When GHAS is
          # turned on (e.g. by going public), flip `upload` back to
          # `always` and remove the artifact step.
          upload: never
          output: sarif-results

      - name: Upload SARIF as workflow artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: sarif-results
          retention-days: 30
