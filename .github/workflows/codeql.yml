# CodeQL — GitHub-native SAST (static analysis security testing).
#
# Catches: SQL injection, path traversal, hardcoded credentials, insecure
# crypto, command injection, XSS, prototype pollution, eval-on-user-input,
# and language-specific bug patterns. Findings show up in the repo's
# Security tab and as PR annotations.
#
# Two analyses run in parallel:
#   - go                       — covers cmd/, internal/, pkg/, test/
#   - javascript-typescript    — covers the React + TS frontend in web/
#
# Uses GitHub's "security-and-quality" query suite (broader than default
# — catches lower-severity-but-real issues too).
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly Monday 03:00 UTC — picks up new CodeQL queries against the
    # current main even when no commits land.
    - cron: "0 3 * * 1"

# Default deny — any job without an explicit permissions: block runs with
# the GITHUB_TOKEN restricted to read-only contents access. Per-job
# permissions below opt back into the additional scopes they actually need
# (security-events: write for SARIF upload, etc.).
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # setup-go is needed for the Go matrix entry so autobuild's
      # `go build ./...` runs on the project's pinned toolchain (1.25)
      # against the vendored deps. Harmless no-op for the JS matrix entry.
      - name: Setup Go
        if: matrix.language == 'go'
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.25"
          cache: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e46ed2cbd01164d986452f91f178727624ae40d7 # v4.35.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality

      # Autobuild handles Go (`go build ./...`). For the JS matrix entry
      # build-mode is "none" — CodeQL extracts directly from source.
      - name: Autobuild
        if: matrix.build-mode == 'autobuild'
        uses: github/codeql-action/autobuild@e46ed2cbd01164d986452f91f178727624ae40d7 # v4.35.3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@e46ed2cbd01164d986452f91f178727624ae40d7 # v4.35.3
        with:
          category: /language:${{ matrix.language }}
