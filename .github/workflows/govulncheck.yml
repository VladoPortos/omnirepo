# govulncheck — Go's official vulnerability checker.
#
# Reads our go.mod and source call graph and reports vulnerabilities from the
# Go vulnerability database. Complements Trivy and CodeQL.
name: govulncheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "15 3 * * 1"

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck (Go module vuln scan)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Do not set GOFLAGS=-mod=vendor at job scope. Installing the scanner
    # would then fail before it can analyze the vendored application module.
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.25.12"
          check-latest: true
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: Run govulncheck
        shell: bash
        run: |
          set +e
          govulncheck -format sarif ./... > govulncheck.sarif
          scan_status=$?
          set -e

          # Exit 3 means vulnerabilities were found. Any other non-zero status
          # is a scanner/build failure and must never be allowlisted.
          if [[ "$scan_status" -ne 0 && "$scan_status" -ne 3 ]]; then
            cat govulncheck.sarif
            exit "$scan_status"
          fi

          jq -e '.runs' govulncheck.sarif >/dev/null
          mapfile -t findings < <(
            jq -r '.runs[].results[]?.ruleId' govulncheck.sarif | sort -u
          )
          printf '%s\n' "${findings[@]}"

          # These reports have no fixed v1 dependency release and do not map
          # to executable OmniRepo paths:
          # - GO-2026-5064/5338/5622 affect containerd CRI checkpoint restore;
          #   OmniRepo vendors no containerd CRI package and uses only Helm's
          #   registry distribution client.
          # - GO-2026-5932 is x/crypto/openpgp pulled by RPM/Helm signature
          #   helpers; OmniRepo calls neither dependency's OpenPGP APIs and
          #   uses the maintained ProtonMail fork for its own signing paths.
          allowed='^(GO-2026-5064|GO-2026-5338|GO-2026-5622|GO-2026-5932)$'
          unexpected="$(printf '%s\n' "${findings[@]}" | grep -Ev "$allowed" || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected reachable vulnerabilities:"
            echo "$unexpected"
            exit 3
          fi

          if [[ "${#findings[@]}" -gt 0 ]]; then
            echo "::warning::Only reviewed, non-reachable, no-fix advisories were reported"
          fi
