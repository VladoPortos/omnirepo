# govulncheck — Go's official vulnerability checker.
#
# Reads our go.mod and source call graph and reports vulnerabilities from the
# Go vulnerability database. Complements Trivy and CodeQL.
name: govulncheck

on:
  push:
    branches: [release]
  pull_request:
    branches: [release]
  schedule:
    - cron: "15 3 * * 1"

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck (Go module vuln scan)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Do not set GOFLAGS=-mod=vendor at job scope. Installing the scanner
    # would then fail before it can analyze the vendored application module.
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.7"
          check-latest: true
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: Run govulncheck
        shell: bash
        run: |
          set +e
          govulncheck -scan symbol -format sarif ./... > govulncheck.sarif
          scan_status=$?
          set -e

          # SARIF mode returns zero even for findings. A non-zero status is a
          # scanner/build failure and must never be allowlisted.
          if [[ "$scan_status" -ne 0 ]]; then
            cat govulncheck.sarif
            exit "$scan_status"
          fi

          jq -e '.runs | type == "array" and length > 0' govulncheck.sarif >/dev/null
          jq -r '.runs[].results[]? | [.level, .ruleId, .message.text] | @tsv' govulncheck.sarif
          # In symbol mode, error means a vulnerable symbol is called;
          # warning/note mean imported/module-only, without a detected call.
          mapfile -t findings < <(
            jq -r '.runs[].results[]? | select(.level == "error") | .ruleId' govulncheck.sarif | sort -u
          )
          printf '%s\n' "${findings[@]}"

          # These reports have no fixed v1 dependency release and do not map
          # to executable OmniRepo paths:
          # - GO-2026-5064/5338/5622 affect containerd CRI checkpoint restore;
          #   OmniRepo vendors no containerd CRI package and uses only Helm's
          #   registry distribution client.
          # - GO-2026-5932 is x/crypto/openpgp pulled by RPM/Helm signature
          #   helpers; OmniRepo calls neither dependency's OpenPGP APIs and
          #   uses the maintained ProtonMail fork for its own signing paths.
          allowed='^(GO-2026-5064|GO-2026-5338|GO-2026-5622|GO-2026-5932)$'
          unexpected="$(printf '%s\n' "${findings[@]}" | grep -Ev "$allowed" || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected reachable vulnerabilities:"
            echo "$unexpected"
            exit 3
          fi

          if [[ "${#findings[@]}" -gt 0 ]]; then
            echo "::warning::Call-level findings match existing reviewed exceptions; see SARIF for all findings"
          fi

      - name: Upload vulnerability report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: govulncheck-sarif
          path: govulncheck.sarif
          if-no-files-found: ignore
