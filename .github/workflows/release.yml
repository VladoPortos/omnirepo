name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  verify:
    # Local reusable workflow runs from this exact tag commit. No main-branch
    # green result can substitute for checking the code being published.
    uses: ./.github/workflows/ci.yml

  release:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    concurrency:
      group: release-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Decide stable release promotion
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git fetch --tags origin
          node scripts/release-policy.mjs
          test "$(git rev-parse HEAD)" = "$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.series }},enable=${{ steps.version.outputs.series_latest }}
            type=raw,value=latest,enable=${{ steps.version.outputs.latest }}

      - uses: docker/setup-buildx-action@v4

      - name: Build and push (linux/amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
          IMAGE_VERSION: ${{ steps.version.outputs.version }}
          IMAGE_SERIES: ${{ steps.version.outputs.series }}
          IS_PRERELEASE: ${{ steps.version.outputs.prerelease }}
          IS_LATEST: ${{ steps.version.outputs.latest }}
          IS_SERIES_LATEST: ${{ steps.version.outputs.series_latest }}
        run: |
          set -euo pipefail
          cat > /tmp/notes.md <<NOTES
          OmniRepo ${RELEASE_TAG} — a self-hosted, air-gap-friendly artifact server in a single container. Serves OCI/Docker, RPM/YUM, APT/Debian, PyPI, Helm, RAW, S3-compatible buckets, and Git on one port, with Trivy-powered vulnerability scanning, a project-scoped user model, web UI, and REST API.

          ### Container image
          \`\`\`
          docker pull ${IMAGE_REPOSITORY}:${IMAGE_VERSION}
          \`\`\`
          Image platform: linux/amd64.

          ### Run
          \`\`\`
          docker run -d --name omnirepo \\
            -p 8080:8080 -p 8443:8443 \\
            -v omnirepo-data:/var/lib/omnirepo \\
            ${IMAGE_REPOSITORY}:${IMAGE_VERSION}
          \`\`\`
          HTTP on 8080, HTTPS (self-signed by default) on 8443; all mutable state lives under the mounted \`/var/lib/omnirepo\` volume.
          NOTES
          flags=(--latest=false)
          if [ "$IS_PRERELEASE" = true ]; then
            flags+=(--prerelease)
          elif [ "$IS_LATEST" = true ]; then
            flags=(--latest)
            printf '\nAlso published as :latest.\n' >> /tmp/notes.md
          fi
          if [ "$IS_SERIES_LATEST" = true ]; then
            printf '\nAlso published as :%s.\n' "$IMAGE_SERIES" >> /tmp/notes.md
          fi
          gh release create "$RELEASE_TAG" --verify-tag \
            --title "OmniRepo $RELEASE_TAG" \
            --notes-file /tmp/notes.md "${flags[@]}"
