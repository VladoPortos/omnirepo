# OpenSSF Scorecard — automated scoring against ~20 supply-chain &
# repo-hygiene best practices.
#
# Scores 0-10. Findings (e.g. "branch protection not enforced", "no code
# review required", "binaries committed", "permissive Actions
# permissions", "unpinned third-party actions") show up in the Security
# tab.
#
# Runs weekly + on every push to main. NOTE: this repo is **private**, so
# `publish_results: false` — the public badge endpoint at
# api.securityscorecards.dev only accepts public repos. A subset of
# Scorecard checks (branch-protection visibility, CI-tests detection,
# license discoverability) work fully on private repos; others
# (CII-Best-Practices, Dependency-Update-Tool federation) report N/A.
# The Security-tab SARIF upload still gives full local visibility.
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:

# Token permissions: minimum required for Scorecard to read repo state
# and write its findings to the Security tab.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      security-events: write
      id-token: write
      # Scorecard needs read-only API access to inspect branch protection
      # rules + Dependabot status on a private repo.
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          # Private repo — do NOT publish to securityscorecards.dev.
          # Flip to true if/when the repo is made public.
          publish_results: false

      - name: Upload artifact (SARIF)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to Security tab
        uses: github/codeql-action/upload-sarif@e46ed2cbd01164d986452f91f178727624ae40d7 # v4.35.3
        with:
          sarif_file: results.sarif
