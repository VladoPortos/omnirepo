# OpenSSF Scorecard — automated scoring against ~20 supply-chain &
# repo-hygiene best practices.
#
# Scores 0-10. Findings (e.g. "branch protection not enforced", "no code
# review required", "binaries committed", "permissive Actions
# permissions", "unpinned third-party actions") show up in the Security
# tab.
#
# ----------------------------------------------------------------------
# PRIVATE REPO SETUP (REQUIRED — workflow no-ops without this):
# ----------------------------------------------------------------------
# On private repos the default GITHUB_TOKEN is too restricted to run
# Scorecard's checks (it 400s on `ListCommits`, `BranchProtection`, etc.
# — observed first run: "Resource not accessible by integration").
#
# To enable, create a fine-grained PAT with READ-ONLY access to this
# repo, granting these scopes:
#   - Repository permissions:
#       Administration: read    (branch protection)
#       Contents:       read    (commits, file listings)
#       Issues:         read    (CII-best-practices indirection)
#       Metadata:       read    (always required)
#       Pull requests:  read    (code review checks)
#   - No write scopes; no organization scopes.
# Save it as a repository secret named: SCORECARD_TOKEN
#
# Once the secret exists, this workflow runs end-to-end. Until then the
# guard step below short-circuits with a warning so it doesn't gate
# unrelated PRs in red.
#
# Note: `publish_results: false` is fixed — the public badge endpoint at
# api.securityscorecards.dev only accepts public repos. SARIF still
# uploads to the repo's Security tab regardless.
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:

# Token permissions: minimum required for Scorecard to read repo state
# and write its findings to the Security tab.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      security-events: write
      id-token: write
      # Scorecard needs read-only API access to inspect branch protection
      # rules + Dependabot status on a private repo.
      contents: read
      actions: read

    # Gate on the PAT secret — avoids a permanent red workflow on
    # private repos pre-setup. Workflow runs but no-ops with a warning
    # until SCORECARD_TOKEN is provisioned.
    env:
      HAS_SCORECARD_TOKEN: ${{ secrets.SCORECARD_TOKEN != '' }}

    steps:
      - name: Notice (skipped — no SCORECARD_TOKEN)
        if: env.HAS_SCORECARD_TOKEN != 'true'
        run: echo "::warning::SCORECARD_TOKEN secret not set — skipping. See workflow header comment for PAT setup."

      - name: Checkout code
        if: env.HAS_SCORECARD_TOKEN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        if: env.HAS_SCORECARD_TOKEN == 'true'
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # PAT for private-repo API access. Required scopes documented
          # in the workflow header comment above.
          repo_token: ${{ secrets.SCORECARD_TOKEN }}
          # Private repo — do NOT publish to securityscorecards.dev.
          # Flip to true if/when the repo is made public.
          publish_results: false

      - name: Upload artifact (SARIF)
        if: env.HAS_SCORECARD_TOKEN == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to Security tab
        if: env.HAS_SCORECARD_TOKEN == 'true'
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: results.sarif
