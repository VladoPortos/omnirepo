                    type: string
                    nullable: true
        default:
          $ref: '#/components/responses/ValidationError'

  /projects/{name}/repos/{type}/{repo}/sync-jobs/{id}:
    get:
      operationId: getSyncJob
      tags: [sync]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: type
          in: path
          required: true
          schema:
            type: string
        - name: repo
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Sync job detail with log
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncJob'
        default:
          $ref: '#/components/responses/ValidationError'

  # ============================== DOCKER ==============================
  /projects/{name}/repos/docker/{repo}/pull-external:
    post:
      operationId: dockerPullExternal
      tags: [docker]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: repo
