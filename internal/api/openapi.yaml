            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        "429":
          description: Rate-limited (retry_after_seconds in details)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        default:
          $ref: '#/components/responses/ValidationError'

  /admin/jobs/summary:
    get:
      operationId: getJobsSummary
      tags: [admin]
      summary: Background jobs card — running/queued counts and last-failure.
      responses:
        "200":
          description: Jobs summary (LOCKED D-06 shape)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobsSummary'
        "401":
          $ref: '#/components/responses/PermissionError'
        "403":
          $ref: '#/components/responses/PermissionError'
        default:
          $ref: '#/components/responses/ValidationError'

  /admin/trivy/db/history:
    get:
      operationId: listTrivyDBHistory
      tags: [admin]
      summary: Rotation history for the Trivy vulnerability DB.
      responses:
        "200":
          description: History rows
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
        default:
          $ref: '#/components/responses/ValidationError'

  /admin/trivy/db/pull/status:
    get:
      operationId: getTrivyDBPullStatus
      tags: [admin]
      summary: Current progress of an in-flight Trivy DB pull.
      responses:
        "200":
          description: Pull status
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: '#/components/responses/ValidationError'
