openapi: "3.1.0"
info:
  title: OmniRepo API
  version: "1.0.0"
  description: |
    REST API for OmniRepo — self-hosted artifact repository server.
    Serves OCI/Docker, RPM, APT/Debian, PyPI, Helm, RAW, S3, and Git
    from a single container on one HTTP/HTTPS port.

servers:
  - url: /api/v1

security:
  - cookieAuth: []
  - bearerAuth: []

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
    bearerAuth:
      type: http
      scheme: bearer

  schemas:
    # -- Generic --
    # ErrorResponse is hand-written in errors.go to coexist with existing handlers.
    # ApiErrorEnvelope is the Phase 6 canonical envelope (ERR-01); plan 02 swaps
    # operation-level error responses to $ref the shared components.responses
    # defined below.

    ApiErrorClass:
      type: string
      enum: [validation, permission, transient, operator_action_required]
      description: Stable client-facing error classification — drives UI icon/copy/CTA.

    ApiErrorEnvelope:
      type: object
      required: [code, message, class]
      properties:
        code:
          type: string
          pattern: "^[a-z][a-z0-9_]*\\.[a-z][a-z0-9_]*$"
          maxLength: 80
          description: Stable machine identifier (e.g. "repo.not_found")
        message:
          type: string
          maxLength: 280
          description: Human-friendly single-sentence message (no internal paths)
        hint:
          type: string
          maxLength: 280
          description: Optional single-sentence remediation guidance
        class:
          $ref: '#/components/schemas/ApiErrorClass'
        incident_id:
          type: string
          maxLength: 64
          description: Server-generated correlation ID (UUID v7) — matches slog request_id and the X-Incident-Id response header
        details:
          type: object
          additionalProperties: true
          properties:
            field:
              type: string
              description: Dot-path of the offending form field (validation class)
            fields:
              type: object
              additionalProperties:
                type: string
              description: Map of field-path to error-code for multi-field validation failures
            retry_after_ms:
              type: integer
              minimum: 0
              description: Suggested retry delay in ms (transient class)
            operator_route:
              type: string
              description: UI path (e.g. "/admin/trivy") for operator_action_required deep-link
            operator_label:
              type: string
              description: CTA label for the operator deep-link (e.g. "Go to Admin → Trivy")

    PaginatedList:
      type: object
      properties:
        items:
          type: array
          items: {}
        next_cursor:
          type: string
          nullable: true

    # -- Auth --
    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
        password:
          type: string

    LoginResponse:
      type: object
      required: [login, is_super_admin, must_change_password]
      properties:
        login:
          type: string
        is_super_admin:
          type: boolean
        must_change_password:
          type: boolean

    ChangePasswordRequest:
      type: object
      required: [current, new]
      properties:
        current:
          type: string
        new:
          type: string

    # -- Setup (first-run bootstrap) --
    SetupStatusResponse:
      type: object
      required: [needs_setup]
      properties:
        needs_setup:
          type: boolean
          description: >
            true while the users table has zero live rows. Flips to false
            permanently after the first successful POST /setup/superadmin.
    SetupSuperAdminBody:
      type: object
      required: [login, email, password]
      properties:
        login:
          type: string
        email:
          # Plain string — the handler validates non-empty via its own
          # check, not format: email. Using format: email here would
          # make oapi-codegen generate openapi_types.Email, which runs
          # RFC-5322 validation at JSON-decode time and returns a 400
          # on any malformed input, shadowing the handler's 422.
          type: string
        password:
          type: string
          minLength: 8
    SetupSuperAdminReply:
      type: object
      required: [login, is_super_admin]
      properties:
        login:
          type: string
        is_super_admin:
          type: boolean

    # -- User --
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
        login:
          type: string
        email:
          type: string
        is_super_admin:
          type: boolean
        must_change_password:
          type: boolean
        avatar_seed:
          type: string
        created_at:
          type: string
          format: date-time

    MeResponse:
      type: object
      required: [id, login, email, is_super_admin, must_change_password]
      properties:
        id:
          type: integer
          format: int64
        login:
          type: string
        email:
          type: string
        is_super_admin:
          type: boolean
        must_change_password:
          type: boolean
        avatar_seed:
          type: string
        project_roles:
          type: object
          description: >
            Map of project name → caller's role in that project ("maintainer"
            or "viewer"). Omitted or empty for super-admin callers (they use
            is_super_admin for gating). Only projects the caller is a member
            of appear (D-16).
          additionalProperties:
            type: string
            enum: [maintainer, viewer]

    MeUpdateRequest:
      type: object
      properties:
        email:
          type: string
        avatar_seed:
          type: string

    UserCreate:
      type: object
      required: [login, email]
      properties:
        login:
          type: string
        email:
          type: string

    UserCreateResponse:
      type: object
      required: [login, one_time_password]
      properties:
        login:
          type: string
        one_time_password:
          type: string

    UserUpdate:
      type: object
      properties:
        email:
          type: string
        is_super_admin:
          type: boolean

    # -- Project --
    Project:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description_md:
          type: string
        created_at:
          type: string
          format: date-time
        members:
          type: array
          description: Members of the project (only present on the detail response).
          items:
            type: object
            required: [user_id, login, email, role]
            properties:
              user_id:
                type: integer
                format: int64
              login:
                type: string
              email:
                type: string
              role:
                type: string
                enum: [maintainer, viewer]
                description: >
                  Role of this member in the project. "maintainer" has full
                  write access; "viewer" has read-only access (D-17).

    ProjectCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description_md:
          type: string

    ProjectCreateResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string

    # -- Repo --
    Repo:
      type: object
      properties:
        id:
          type: integer
          format: int64
        project_id:
          type: integer
          format: int64
        type:
          type: string
        name:
          type: string
        description_md:
          type: string
        auto_scan:
          type: boolean
        block_on_severity:
          type: string
          enum: [none, low, medium, high, critical]
        public_read:
          type: boolean
        size_bytes:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time

    RepoCreate:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
        type:
          type: string
        description_md:
          type: string
        auto_scan:
          type: boolean
        block_on_severity:
          type: string
          enum: [none, low, medium, high, critical]
        public_read:
          type: boolean

    RepoPatch:
      type: object
      properties:
        description_md:
          type: string
        auto_scan:
          type: boolean
        block_on_severity:
          type: string
          enum: [none, low, medium, high, critical]
        public_read:
          type: boolean

    WipeResponse:
      type: object
      properties:
        artifact_count:
          type: integer
          format: int64
        bytes_freed:
          type: integer
          format: int64
        trash_id:
          type: string

    # -- Sync --
    SyncRequest:
      type: object
      required: [source_url]
      properties:
        source_url:
          type: string
        cred_id:
          type: integer
          format: int64

    SyncJob:
      type: object
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
        repo_id:
          type: integer
          format: int64
        status:
          type: string
          enum: [pending, running, done, failed]
        log:
          type: string
        error:
          type: string
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        # Phase 8 Plan 02 (M2.2) — byte-level progress tracking (MIRROR-10).
        progress_bytes:
          type: integer
          format: int64
          minimum: 0
          description: "Bytes downloaded so far for the running sync. Always 0 for Helm (step-based progress — D-11)."
        total_bytes:
          type: integer
          format: int64
          minimum: 0
          description: "Total bytes expected for the sync. Always 0 for Helm and when the upstream doesn't report sizes (D-11)."
        current_step:
          type: string
          description: "Human-readable current step, e.g. 'layer 3 of 7' (OCI), 'pulling redis_7.2.0' (APT), or 'chart 2 of 12 · redis-17.0.0.tgz' (Helm). Empty when not yet started."
        # Quick task 260420-d03-sync-pill-file-count — D-03 closure.
        files_synced:
          type: integer
          format: int64
          minimum: 0
          description: "Count of files newly added during sync. Written once at sync completion by each protocol handler (not the throttled progress path). 0 for running jobs and legacy rows."

    # -- Scan --
    Scan:
      type: object
      properties:
        id:
          type: integer
          format: int64
        repo_id:
          type: integer
          format: int64
        artifact_kind:
          type: string
        artifact_id:
          type: string
        status:
          type: string
          enum: [pending, running, done, failed]
        attempts:
          type: integer
          format: int64
        last_error:
          type: string
        severity_summary_json:
          type: string
        sbom_path:
          type: string
        trivy_db_version:
          type: string
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time

    Vulnerability:
      type: object
      properties:
        id:
          type: integer
          format: int64
        scan_id:
          type: integer
          format: int64
        cve_id:
          type: string
        severity:
          type: string
          enum: [CRITICAL, HIGH, MEDIUM, LOW, UNKNOWN]
        package_name:
          type: string
        package_version:
          type: string
        fixed_version:
          type: string
        title:
          type: string
        description:
          type: string

    SBOMRef:
      type: object
      properties:
        scan_id:
          type: integer
          format: int64
        format:
          type: string
        download_url:
          type: string

    # -- Search --
    SearchResult:
      type: object
      properties:
        kind:
          type: string
          enum: [repo, artifact, cve, rpm, deb, pypi, helm]
        entity_id:
          type: integer
          format: int64
        name:
          type: string
        location:
          type: string
        severity:
          type: string
        score:
          type: number
          format: double

    SearchResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SearchResult'
        next_cursor:
          type: string
          nullable: true

    # -- Audit --
    AuditEvent:
      type: object
      properties:
        id:
          type: integer
          format: int64
        timestamp:
          type: string
          format: date-time
        actor:
          type: string
        action:
          type: string
        target_kind:
          type: string
        target_id:
          type: string
        outcome:
          type: string
        ip:
          type: string
        user_agent:
          type: string
        details:
          type: object
          additionalProperties: true

    AuditListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        next_cursor:
          type: string
          nullable: true

    # -- TLS --
    TLSCertInfo:
      type: object
      properties:
        subject:
          type: string
        issuer:
          type: string
        not_before:
          type: string
          format: date-time
        not_after:
          type: string
          format: date-time
        serial:
          type: string
        fingerprint_sha256:
          type: string
        source:
          type: string
          enum: [self-signed, uploaded]

    TLSHistoryEntry:
      type: object
      properties:
        uploaded_at:
          type: string
          format: date-time
        uploaded_by:
          type: string
        subject:
          type: string
        fingerprint_sha256:
          type: string

    # -- Trivy DB --
    TrivyDBStatus:
      type: object
      properties:
        version:
          type: string
        age_hours:
          type: number
          format: double
        source:
          type: string
          enum: [baked-in, uploaded, online-pulled]
        stale:
          type: boolean
        applied_at:
          type: string
          format: date-time

    # -- GC --
    GCTriggerResponse:
      type: object
      properties:
        job_id:
          type: integer
          format: int64

    GCStatusResponse:
      type: object
      properties:
        status:
          type: string
          enum: [idle, running, done, failed]
        job_id:
          type: integer
          format: int64
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        bytes_freed:
          type: integer
          format: int64

    # -- Maintenance --
    MaintenanceStatus:
      type: object
      properties:
        enabled:
          type: boolean

    MaintenanceToggle:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean

    # -- Trash --
    TrashEntry:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        original_location:
          type: string
        deleted_by:
          type: string
        deleted_at:
          type: string
          format: date-time
        retention_countdown:
          type: string

    TrashListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TrashEntry'
        next_cursor:
          type: string
          nullable: true

    # -- Settings --
    SettingsMap:
      type: object
      additionalProperties:
        type: string

    SettingsPatch:
      type: object
      additionalProperties:
        type: string

    # -- Dashboard --
    DashboardResponse:
      type: object
      properties:
        storage_used:
          type: integer
          format: int64
        storage_total:
          type: integer
          format: int64
        repo_count:
          type: integer
        user_count:
          type: integer
        scan_findings_summary:
          type: object
          additionalProperties: true
        recent_activity:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'

    # -- Git --
    GitTreeEntry:
      type: object
      properties:
        name:
          type: string
        path:
          type: string
        type:
          type: string
          enum: [blob, tree, commit]
        size:
          type: integer
          format: int64
        sha:
          type: string

    GitFileContent:
      type: object
      properties:
        name:
          type: string
        path:
          type: string
        sha:
          type: string
        size:
          type: integer
          format: int64
        encoding:
          type: string
        content:
          type: string

    GitCommit:
      type: object
      properties:
        sha:
          type: string
        message:
          type: string
        author_name:
          type: string
        author_email:
          type: string
        author_date:
          type: string
          format: date-time
        committer_name:
          type: string
        committer_email:
          type: string
        committer_date:
          type: string
          format: date-time
        parent_shas:
          type: array
          items:
            type: string

    GitDiff:
      type: object
      properties:
        sha:
          type: string
        message:
          type: string
        stats:
          type: object
          properties:
            additions:
              type: integer
            deletions:
              type: integer
            files_changed:
              type: integer
        files:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              status:
                type: string
              patch:
                type: string

    GitBlame:
      type: object
      properties:
        path:
          type: string
        lines:
          type: array
          items:
            type: object
            properties:
              line_number:
                type: integer
              sha:
                type: string
              author:
                type: string
              date:
                type: string
                format: date-time
              content:
                type: string

    GitRef:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum: [branch, tag]
        sha:
          type: string

    GitCompareResponse:
      type: object
      properties:
        base:
          type: string
        head:
          type: string
        ahead_by:
          type: integer
        behind_by:
          type: integer
        commits:
          type: array
          items:
            $ref: '#/components/schemas/GitCommit'
        files:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              status:
                type: string
              patch:
                type: string

    # -- API Keys --
    APIKey:
      type: object
      properties:
        id:
          type: integer
          format: int64
        prefix:
          type: string
        label:
          type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time

    APIKeyCreate:
      type: object
      required: [label]
      properties:
        label:
          type: string

    APIKeyCreateResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        prefix:
          type: string
        secret:
          type: string
          description: Shown once at creation time only
        label:
          type: string
        created_at:
          type: string
          format: date-time

    # -- S3 Keys --
    S3Key:
      type: object
      properties:
        id:
          type: integer
          format: int64
        access_key_id:
          type: string
        label:
          type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time

    S3KeyCreate:
      type: object
      required: [label]
      properties:
        label:
          type: string

    S3KeyCreateResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        access_key_id:
          type: string
        secret:
          type: string
          description: Shown once at creation time only
        label:
          type: string
        created_at:
          type: string
          format: date-time

    # -- Upstream Creds --
    UpstreamCred:
      type: object
      properties:
        id:
          type: integer
          format: int64
        host:
          type: string
        kind:
          type: string
        username:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UpstreamCredCreate:
      type: object
      required: [host, kind]
      properties:
        host:
          type: string
        kind:
          type: string
        username:
          type: string
        password:
          type: string
        token:
          type: string

    # -- Docker --
    DockerPullExternalRequest:
      type: object
      required: [image]
      properties:
        image:
          type: string
        tag:
          type: string
        cred_id:
          type: integer
          format: int64

    DockerPromoteRequest:
      type: object
      required: [source_repo, digest]
      properties:
        source_repo:
          type: string
        digest:
          type: string
        new_tag:
          type: string

    # -- Upload --
    UploadResponse:
      type: object
      properties:
        artifact_count:
          type: integer
        scan_id:
          type: integer
          format: int64

    # -- Activity --
    ActivityEvent:
      type: object
      properties:
        id:
          type: integer
          format: int64
        timestamp:
          type: string
          format: date-time
        actor:
          type: string
        action:
          type: string
        target_kind:
          type: string
        target_id:
          type: string
        details:
          type: object
          additionalProperties: true

    ActivityListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ActivityEvent'
        next_cursor:
          type: string
          nullable: true

    # -- Members --
    MemberAction:
      type: object
      properties:
        status:
          type: string

    StatusOK:
      type: object
      properties:
        status:
          type: string

    # -- Scans --
    ScanRow:
      type: object
      required: [id, repo_id, artifact_kind, artifact_id, status, attempts, created_at]
      properties:
        id: { type: integer, format: int64 }
        repo_id: { type: integer, format: int64 }
        artifact_kind: { type: string }
        artifact_id: { type: string }
        status: { type: string }
        attempts: { type: integer, format: int64 }
        last_error: { type: string }
        severity_summary_json: { type: string }
        sbom_path: { type: string }
        trivy_db_version: { type: string }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }

    VulnerabilityRow:
      type: object
      required: [id, scan_id, cve_id, severity, package_name, package_version, fixed_version, title]
      properties:
        id: { type: integer, format: int64 }
        scan_id: { type: integer, format: int64 }
        cve_id: { type: string }
        severity: { type: string }
        package_name: { type: string }
        package_version: { type: string }
        fixed_version: { type: string }
        title: { type: string }
        description: { type: string }

    # -- Admin: jobs summary (LOCKED D-06) --
    JobsSummary:
      type: object
      required: [running, queued, failed_last_24h, last_completed_at, last_failed_at]
      properties:
        running: { type: integer }
        queued: { type: integer }
        failed_last_24h: { type: integer }
        last_completed_at: { type: string, format: date-time, nullable: true }
        last_failed_at: { type: string, format: date-time, nullable: true }

    # -- Admin: db health (LOCKED per plan 10-02) --
    DBHealth:
      type: object
      required: [integrity, size, wal, journal_mode, driver, running, can_run_now]
      properties:
        integrity:
          type: object
          required: [status]
          properties:
            status: { type: string }
            checked_at: { type: string, format: date-time }
            duration_ms: { type: integer, format: int64 }
        size:
          type: object
          properties:
            on_disk_bytes: { type: integer, format: int64 }
            logical_bytes: { type: integer, format: int64 }
            page_count: { type: integer, format: int64 }
            page_size: { type: integer, format: int64 }
            freelist_count: { type: integer, format: int64 }
            freelist_bytes: { type: integer, format: int64 }
        wal:
          type: object
          properties:
            bytes: { type: integer, format: int64 }
            warn_over_bytes: { type: integer, format: int64 }
        journal_mode: { type: string }
        driver:
          type: object
          properties:
            label: { type: string }
            pragmas:
              type: object
              additionalProperties: { type: string }
        running: { type: boolean }
        can_run_now: { type: boolean }
        next_available_at: { type: string }
        last_manual_run_at: { type: string }

  responses:
    ValidationError:
      description: Request failed validation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorEnvelope' }
    PermissionError:
      description: Caller lacks permission
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorEnvelope' }
    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorEnvelope' }
    TransientError:
      description: Temporary failure — retry may succeed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorEnvelope' }
    OperatorActionRequired:
      description: Administrator must resolve before the operation can succeed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorEnvelope' }

  parameters:
    limitParam:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    cursorParam:
      name: cursor
      in: query
      schema:
        type: string

paths:
  # ============================== SETUP (first-run bootstrap) ==============================
  /setup/status:
    get:
      operationId: getSetupStatus
      security: []
      tags: [setup]
      summary: Report whether first-run setup is required
      responses:
        "200":
          description: Setup status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupStatusResponse'
        default:
          $ref: '#/components/responses/ValidationError'
  /setup/superadmin:
    post:
      operationId: setupSuperAdmin
      security: []
      tags: [setup]
      summary: Create the first super-admin on an empty install
      description: >
        Succeeds only while the users table is empty. Returns 409 once any
        live user exists — the endpoint is naturally one-shot. The response
        does not carry a session cookie; the operator must sign in via
        /auth/login afterward.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupSuperAdminBody'
      responses:
        "200":
          description: Super-admin created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupSuperAdminReply'
        "409":
          description: Setup already completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        default:
          $ref: '#/components/responses/ValidationError'

  # ============================== AUTH ==============================
  /auth/login:
    post:
      operationId: login
      security: []
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        "401":
          $ref: '#/components/responses/PermissionError'
        default:
          $ref: '#/components/responses/ValidationError'
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusOK'
        default:
          $ref: '#/components/responses/ValidationError'

  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusOK'
        default:
          $ref: '#/components/responses/ValidationError'

  # ============================== ME ==============================
  /me:
    get:
      operationId: getMe
      tags: [me]
      responses:
        "200":
          description: Current user info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        default:
          $ref: '#/components/responses/ValidationError'
    patch:
      operationId: updateMe
      tags: [me]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeUpdateRequest'
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        default:
          $ref: '#/components/responses/ValidationError'
    delete:
      operationId: deleteMe
      tags: [me]
      responses:
        "200":
          description: Account deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusOK'
        default:
          $ref: '#/components/responses/ValidationError'

  # ============================== API KEYS ==============================
  /me/api-keys:
    get:
      operationId: listMyAPIKeys
      tags: [api-keys]
      responses:
        "200":
          description: List of API keys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/APIKey'
        default:
          $ref: '#/components/responses/ValidationError'
    post:
      operationId: createAPIKey
      tags: [api-keys]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/APIKeyCreate'
      responses:
        "201":
          description: API key created (secret shown once)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKeyCreateResponse'
        default:
          $ref: '#/components/responses/ValidationError'

  /me/api-keys/{id}:
    delete:
      operationId: deleteAPIKey
      tags: [api-keys]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: API key revoked
        default:
          $ref: '#/components/responses/ValidationError'

  # =========================== PROJECT API KEYS ===========================
  /projects/{name}/api-keys:
    get:
      operationId: listProjectAPIKeys
      tags: [api-keys]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of project-owned API keys (omr_p_*)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/APIKey'
        default:
          $ref: '#/components/responses/ValidationError'
    post:
      operationId: createProjectAPIKey
      tags: [api-keys]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/APIKeyCreate'
      responses:
        "201":
          description: Project API key created (secret shown once)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKeyCreateResponse'
        default:
          $ref: '#/components/responses/ValidationError'

  /projects/{name}/api-keys/{id}:
    delete:
      operationId: deleteProjectAPIKey
      tags: [api-keys]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Project API key revoked
        default:
          $ref: '#/components/responses/ValidationError'

  # ============================== ME S3 KEYS ==============================
  /me/s3-keys:
    get:
      operationId: listMyS3Keys
      tags: [s3-keys]
      responses:
        "200":
          description: List of S3 keys across all projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/S3Key'
        default:
          $ref: '#/components/responses/ValidationError'
    post:
      operationId: createMyS3Key
      tags: [s3-keys]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/S3KeyCreate'
      responses:
        "201":
          description: S3 key created (secret shown once)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/S3KeyCreateResponse'
        default:
          $ref: '#/components/responses/ValidationError'

  /me/s3-keys/{id}:
    delete:
      operationId: deleteMyS3Key
      tags: [s3-keys]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: S3 key revoked
        default:
          $ref: '#/components/responses/ValidationError'

  # ============================== PROJECTS ==============================
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      parameters:
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/cursorParam'
      responses:
        "200":
          description: Paginated list of projects
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'
                  next_cursor:
                    type: string
                    nullable: true
        default:
          $ref: '#/components/responses/ValidationError'
    post:
      operationId: createProject
      tags: [projects]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
      responses:
        "200":
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectCreateResponse'
        default:
          $ref: '#/components/responses/ValidationError'

  /projects/{name}:
    get:
      operationId: getProject
      tags: [projects]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Project detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        default:
          $ref: '#/components/responses/ValidationError'
    delete:
      operationId: deleteProject
      tags: [projects]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Project soft-deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusOK'
        default:
          $ref: '#/components/responses/ValidationError'

  /projects/{name}/activity:
    get:
      operationId: getProjectActivity
      tags: [projects]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/cursorParam'
      responses:
        "200":
          description: Per-project activity feed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityListResponse'
        default:
          $ref: '#/components/responses/ValidationError'

  # ============================== MEMBERS ==============================
  /projects/{name}/members/{login}:
    post:
      operationId: addProjectMember
      tags: [members]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: login
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  enum: [maintainer, viewer]
                  default: viewer
                  description: >
                    Role to assign. Defaults to "viewer" when omitted (D-02).
                    Returns 422 codeValidationFailed for any other value.
      responses:
        "200":
          description: Member added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusOK'
        "422":
          description: Invalid role value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        default:
          $ref: '#/components/responses/ValidationError'
    patch:
      operationId: changeProjectMemberRole
      tags: [members]
      summary: Change a project member's role
      description: >
        Changes the role of an existing project member. Requires maintainer or
        super-admin. Returns 409 with code rbac.last_maintainer (codeRBACLastMaintainer)
        if the action would leave zero maintainers; super-admin callers bypass
        this guard (D-06). Emits member.role_changed audit event with
        details_json {user, old_role, new_role} (D-11).
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: login
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [maintainer, viewer]
                  description: New role for the member.
      responses:
        "200":
          description: Role updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusOK'
        "403":
          description: Caller is not a maintainer or super-admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        "409":
          description: >
            Last-maintainer protection — code rbac.last_maintainer
            (codeRBACLastMaintainer). Cannot demote/remove the last human
            maintainer; promote another member first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        "422":
          description: Invalid role value — code validation.failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        default:
          $ref: '#/components/responses/ValidationError'
    delete:
      operationId: removeProjectMember
      tags: [members]
      description: >
        Removes a member from the project. Returns 409 with code
        rbac.last_maintainer (codeRBACLastMaintainer) if the target is
        the last maintainer and the caller is not a super-admin (D-06).
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: login
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Member removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusOK'
        "409":
          description: >
            Last-maintainer protection — code rbac.last_maintainer
            (codeRBACLastMaintainer).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        default:
          $ref: '#/components/responses/ValidationError'

  # ============================== REPOS ==============================
  /projects/{name}/repos:
    get:
      operationId: listRepos
      tags: [repos]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/cursorParam'
      responses:
        "200":
          description: Repos in project
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Repo'
                  next_cursor:
                    type: string
                    nullable: true
        default:
          $ref: '#/components/responses/ValidationError'
    post:
      operationId: createRepo
      tags: [repos]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepoCreate'
      responses:
        "200":
          description: Repo created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Repo'
        default:
          $ref: '#/components/responses/ValidationError'

  /projects/{name}/repos/{type}/{repo}:
    get:
      operationId: getRepo
      tags: [repos]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: type
          in: path
          required: true
          schema:
            type: string
        - name: repo
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Repo detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Repo'
        default:
          $ref: '#/components/responses/ValidationError'
    patch:
      operationId: patchRepo
      tags: [repos]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: type
          in: path
          required: true
          schema:
            type: string
        - name: repo
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepoPatch'
      responses:
        "200":
          description: Repo updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Repo'
        default:
          $ref: '#/components/responses/ValidationError'
    delete:
      operationId: deleteRepo
      tags: [repos]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: type
          in: path
          required: true
          schema:
            type: string
        - name: repo
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Repo soft-deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusOK'
        default:
          $ref: '#/components/responses/ValidationError'

  /projects/{name}/repos/{type}/{repo}/wipe:
    post:
      operationId: wipeRepo
      tags: [repos]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: type
          in: path
          required: true
          schema:
            type: string
        - name: repo
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Repo contents wiped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WipeResponse'
        default:
          $ref: '#/components/responses/ValidationError'

  /projects/{name}/repos/{type}/{repo}/upload:
    post:
      operationId: uploadArtifact
      tags: [repos]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: type
          in: path
          required: true
          schema:
            type: string
        - name: repo
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Artifact uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
        default:
          $ref: '#/components/responses/ValidationError'

  /projects/{name}/repos/{type}/{repo}/sync:
    post:
      operationId: syncRepo
      tags: [sync]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: type
          in: path
          required: true
          schema:
            type: string
        - name: repo
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncRequest'
      responses:
        "202":
          description: Sync job enqueued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncJob'
        default:
          $ref: '#/components/responses/ValidationError'

  /projects/{name}/repos/{type}/{repo}/sync-jobs:
    get:
      operationId: listSyncJobs
      tags: [sync]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: type
          in: path
          required: true
          schema:
            type: string
        - name: repo
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/cursorParam'
      responses:
        "200":
          description: Sync jobs for repo
          content:
            application/json:
              schema:
                type: object
                properties:
