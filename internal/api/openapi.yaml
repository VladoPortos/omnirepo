  /projects/{name}/repos/docker/{repo}/promote:
    post:
      operationId: dockerPromote
      tags: [docker]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: repo
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DockerPromoteRequest'
      responses:
        "200":
          description: Image promoted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusOK'
        default:
          $ref: '#/components/responses/ValidationError'

  # ============================== SCANS ==============================
  /projects/{name}/repos/{type}/{repo}/scans:
    get:
      operationId: listScans
      tags: [scans]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: type
          in: path
          required: true
          schema:
            type: string
        - name: repo
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/cursorParam'
      responses:
        "200":
          description: Scans for repo
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Scan'
                  next_cursor:
                    type: string
                    nullable: true
        default:
          $ref: '#/components/responses/ValidationError'
    post:
      operationId: rescanRepo
      tags: [scans]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: type
          in: path
          required: true
          schema:
            type: string
        - name: repo
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Rescan enqueued
          content:
            application/json:
              schema:
                type: object
                properties:
                  scan_id:
                    type: integer
                    format: int64
