openapi: "3.1.0"
info:
  title: OmniRepo API
  version: "1.0.0"
  description: |
    REST API for OmniRepo — self-hosted artifact repository server.
    Serves OCI/Docker, RPM, APT/Debian, PyPI, Helm, RAW, S3, and Git
    from a single container on one HTTP/HTTPS port.

servers:
  - url: /api/v1

security:
  - cookieAuth: []
  - bearerAuth: []

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
    bearerAuth:
      type: http
      scheme: bearer

  schemas:
    # -- Generic --
    # ErrorResponse is hand-written in errors.go to coexist with existing handlers.
    # ApiErrorEnvelope is the Phase 6 canonical envelope (ERR-01); plan 02 swaps
    # operation-level error responses to $ref the shared components.responses
    # defined below.

    ApiErrorClass:
      type: string
      enum: [validation, permission, transient, operator_action_required]
      description: Stable client-facing error classification — drives UI icon/copy/CTA.

    ApiErrorEnvelope:
      type: object
      required: [code, message, class]
      properties:
        code:
          type: string
          pattern: "^[a-z][a-z0-9_]*\\.[a-z][a-z0-9_]*$"
          maxLength: 80
          description: Stable machine identifier (e.g. "repo.not_found")
        message:
          type: string
          maxLength: 280
          description: Human-friendly single-sentence message (no internal paths)
        hint:
          type: string
          maxLength: 280
          description: Optional single-sentence remediation guidance
        class:
          $ref: '#/components/schemas/ApiErrorClass'
        incident_id:
          type: string
          maxLength: 64
          description: Server-generated correlation ID (UUID v7) — matches slog request_id and the X-Incident-Id response header
        details:
          type: object
          additionalProperties: true
          properties:
            field:
              type: string
              description: Dot-path of the offending form field (validation class)
            fields:
              type: object
              additionalProperties:
                type: string
              description: Map of field-path to error-code for multi-field validation failures
            retry_after_ms:
              type: integer
              minimum: 0
              description: Suggested retry delay in ms (transient class)
            operator_route:
              type: string
              description: UI path (e.g. "/admin/trivy") for operator_action_required deep-link
            operator_label:
              type: string
              description: CTA label for the operator deep-link (e.g. "Go to Admin → Trivy")

    PaginatedList:
      type: object
      properties:
        items:
          type: array
          items: {}
        next_cursor:
          type: string
          nullable: true

    # -- Auth --
    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
        password:
          type: string

    LoginResponse:
      type: object
      required: [login, is_super_admin, must_change_password]
      properties:
        login:
          type: string
        is_super_admin:
          type: boolean
        must_change_password:
          type: boolean

    ChangePasswordRequest:
      type: object
      required: [current, new]
      properties:
        current:
          type: string
        new:
          type: string

    # -- User --
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
        login:
          type: string
        email:
          type: string
        is_super_admin:
          type: boolean
        must_change_password:
          type: boolean
        avatar_seed:
          type: string
        created_at:
          type: string
          format: date-time

    MeResponse:
      type: object
      required: [id, login, email, is_super_admin, must_change_password]
      properties:
        id:
          type: integer
          format: int64
        login:
          type: string
        email:
          type: string
        is_super_admin:
          type: boolean
        must_change_password:
          type: boolean
        avatar_seed:
          type: string

    MeUpdateRequest:
      type: object
      properties:
        email:
          type: string
        avatar_seed:
          type: string

    UserCreate:
      type: object
      required: [login, email]
      properties:
        login:
          type: string
        email:
          type: string

    UserCreateResponse:
      type: object
      required: [login, one_time_password]
      properties:
        login:
          type: string
        one_time_password:
          type: string

    UserUpdate:
      type: object
      properties:
        email:
          type: string
        is_super_admin:
          type: boolean

    # -- Project --
    Project:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description_md:
          type: string
        created_at:
          type: string
          format: date-time

    ProjectCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description_md:
          type: string

    ProjectCreateResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string

    # -- Repo --
    Repo:
      type: object
      properties:
        id:
          type: integer
          format: int64
        project_id:
          type: integer
          format: int64
        type:
          type: string
        name:
          type: string
        description_md:
          type: string
        auto_scan:
          type: boolean
        block_on_severity:
          type: string
          enum: [none, low, medium, high, critical]
        public_read:
          type: boolean
        size_bytes:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time

    RepoCreate:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
        type:
          type: string
        description_md:
          type: string
        auto_scan:
          type: boolean
        block_on_severity:
          type: string
          enum: [none, low, medium, high, critical]
        public_read:
          type: boolean

    RepoPatch:
      type: object
      properties:
        description_md:
          type: string
        auto_scan:
          type: boolean
        block_on_severity:
          type: string
          enum: [none, low, medium, high, critical]
        public_read:
          type: boolean

    WipeResponse:
      type: object
      properties:
        artifact_count:
          type: integer
          format: int64
        bytes_freed:
          type: integer
          format: int64
        trash_id:
          type: string

    # -- Sync --
    SyncRequest:
      type: object
      required: [source_url]
      properties:
        source_url:
          type: string
        cred_id:
          type: integer
          format: int64

    SyncJob:
      type: object
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
        repo_id:
          type: integer
          format: int64
        status:
          type: string
          enum: [pending, running, done, failed]
        log:
          type: string
        error:
          type: string
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time

    # -- Scan --
    Scan:
      type: object
      properties:
        id:
          type: integer
          format: int64
        repo_id:
          type: integer
          format: int64
        artifact_kind:
          type: string
        artifact_id:
          type: string
        status:
          type: string
          enum: [pending, running, done, failed]
        attempts:
          type: integer
          format: int64
        last_error:
          type: string
        severity_summary_json:
          type: string
        sbom_path:
          type: string
        trivy_db_version:
          type: string
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time

    Vulnerability:
      type: object
      properties:
        id:
          type: integer
          format: int64
        scan_id:
          type: integer
          format: int64
        cve_id:
          type: string
        severity:
          type: string
          enum: [CRITICAL, HIGH, MEDIUM, LOW, UNKNOWN]
        package_name:
          type: string
        package_version:
          type: string
        fixed_version:
          type: string
        title:
          type: string
        description:
          type: string

    SBOMRef:
      type: object
      properties:
        scan_id:
          type: integer
          format: int64
        format:
          type: string
        download_url:
          type: string

    # -- Search --
    SearchResult:
      type: object
      properties:
        kind:
          type: string
          enum: [repo, artifact, cve, rpm, deb, pypi, helm]
        entity_id:
          type: integer
          format: int64
        name:
          type: string
        location:
          type: string
        severity:
          type: string
        score:
          type: number
          format: double

    SearchResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SearchResult'
        next_cursor:
          type: string
          nullable: true

    # -- Audit --
    AuditEvent:
      type: object
      properties:
        id:
          type: integer
          format: int64
        timestamp:
          type: string
          format: date-time
        actor:
          type: string
        action:
          type: string
        target_kind:
          type: string
        target_id:
          type: string
        outcome:
          type: string
        ip:
          type: string
        user_agent:
          type: string
        details:
          type: object
          additionalProperties: true

    AuditListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        next_cursor:
          type: string
          nullable: true

    # -- TLS --
    TLSCertInfo:
      type: object
      properties:
        subject:
          type: string
        issuer:
          type: string
        not_before:
          type: string
          format: date-time
        not_after:
          type: string
          format: date-time
        serial:
          type: string
        fingerprint_sha256:
          type: string
        source:
          type: string
          enum: [self-signed, uploaded]

    TLSHistoryEntry:
      type: object
      properties:
        uploaded_at:
          type: string
          format: date-time
        uploaded_by:
          type: string
        subject:
          type: string
        fingerprint_sha256:
          type: string

    # -- Trivy DB --
    TrivyDBStatus:
      type: object
      properties:
        version:
          type: string
        age_hours:
          type: number
          format: double
        source:
          type: string
          enum: [baked-in, uploaded, online-pulled]
        stale:
          type: boolean
        applied_at:
          type: string
          format: date-time

    # -- GC --
    GCTriggerResponse:
      type: object
      properties:
        job_id:
          type: integer
          format: int64

    GCStatusResponse:
      type: object
      properties:
        status:
          type: string
          enum: [idle, running, done, failed]
        job_id:
          type: integer
          format: int64
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        bytes_freed:
          type: integer
          format: int64

    # -- Maintenance --
    MaintenanceStatus:
      type: object
      properties:
        enabled:
          type: boolean

    MaintenanceToggle:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean

    # -- Trash --
    TrashEntry:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        original_location:
          type: string
        deleted_by:
          type: string
        deleted_at:
          type: string
          format: date-time
        retention_countdown:
          type: string

    TrashListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TrashEntry'
        next_cursor:
          type: string
          nullable: true

    # -- Settings --
    SettingsMap:
      type: object
      additionalProperties:
        type: string

    SettingsPatch:
      type: object
      additionalProperties:
        type: string

    # -- Dashboard --
    DashboardResponse:
      type: object
      properties:
        storage_used:
          type: integer
          format: int64
        storage_total:
          type: integer
          format: int64
        repo_count:
          type: integer
        user_count:
          type: integer
        scan_findings_summary:
          type: object
          additionalProperties: true
        recent_activity:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'

    # -- Git --
    GitTreeEntry:
      type: object
      properties:
        name:
          type: string
        path:
          type: string
        type:
          type: string
          enum: [blob, tree, commit]
        size:
          type: integer
          format: int64
        sha:
          type: string

    GitFileContent:
      type: object
      properties:
        name:
          type: string
        path:
          type: string
        sha:
          type: string
        size:
          type: integer
          format: int64
        encoding:
          type: string
        content:
          type: string

    GitCommit:
      type: object
      properties:
        sha:
          type: string
        message:
          type: string
        author_name:
          type: string
        author_email:
          type: string
        author_date:
          type: string
          format: date-time
        committer_name:
          type: string
        committer_email:
          type: string
        committer_date:
          type: string
          format: date-time
        parent_shas:
          type: array
          items:
            type: string

    GitDiff:
      type: object
      properties:
        sha:
          type: string
        message:
          type: string
        stats:
          type: object
          properties:
            additions:
              type: integer
            deletions:
              type: integer
            files_changed:
              type: integer
        files:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              status:
                type: string
              patch:
                type: string

    GitBlame:
      type: object
      properties:
        path:
          type: string
        lines:
          type: array
          items:
            type: object
            properties:
              line_number:
                type: integer
              sha:
                type: string
              author:
                type: string
              date:
                type: string
                format: date-time
              content:
                type: string

    GitRef:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum: [branch, tag]
        sha:
          type: string

    GitCompareResponse:
      type: object
      properties:
        base:
          type: string
        head:
          type: string
        ahead_by:
          type: integer
        behind_by:
          type: integer
        commits:
          type: array
          items:
            $ref: '#/components/schemas/GitCommit'
        files:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              status:
                type: string
              patch:
                type: string

    # -- API Keys --
    APIKey:
      type: object
      properties:
        id:
          type: integer
          format: int64
        prefix:
          type: string
        label:
          type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time

    APIKeyCreate:
      type: object
      required: [label]
      properties:
        label:
          type: string

    APIKeyCreateResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        prefix:
          type: string
        secret:
          type: string
          description: Shown once at creation time only
        label:
          type: string
        created_at:
          type: string
          format: date-time

    # -- S3 Keys --
    S3Key:
      type: object
      properties:
        id:
          type: integer
          format: int64
        access_key_id:
          type: string
        label:
          type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time

    S3KeyCreate:
      type: object
      required: [label]
      properties:
        label:
          type: string

    S3KeyCreateResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        access_key_id:
          type: string
        secret:
          type: string
          description: Shown once at creation time only
        label:
          type: string
        created_at:
          type: string
          format: date-time

    # -- Upstream Creds --
    UpstreamCred:
      type: object
      properties:
        id:
          type: integer
          format: int64
        host:
          type: string
        kind:
          type: string
        username:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UpstreamCredCreate:
      type: object
      required: [host, kind]
      properties:
        host:
          type: string
        kind:
          type: string
        username:
          type: string
        password:
          type: string
        token:
          type: string

    # -- Docker --
    DockerPullExternalRequest:
      type: object
      required: [image]
      properties:
        image:
          type: string
        tag:
          type: string
        cred_id:
          type: integer
          format: int64

    DockerPromoteRequest:
      type: object
      required: [source_repo, digest]
      properties:
        source_repo:
          type: string
        digest:
          type: string
        new_tag:
          type: string

    # -- Upload --
    UploadResponse:
      type: object
      properties:
        artifact_count:
          type: integer
        scan_id:
          type: integer
          format: int64

    # -- Activity --
    ActivityEvent:
      type: object
      properties:
        id:
          type: integer
          format: int64
        timestamp:
          type: string
          format: date-time
        actor:
          type: string
        action:
          type: string
        target_kind:
          type: string
        target_id:
          type: string
        details:
          type: object
          additionalProperties: true

    ActivityListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ActivityEvent'
        next_cursor:
          type: string
          nullable: true

    # -- Members --
    MemberAction:
      type: object
      properties:
        status:
          type: string

    StatusOK:
      type: object
      properties:
        status:
          type: string

  responses:
    ValidationError:
      description: Request failed validation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorEnvelope' }
    PermissionError:
      description: Caller lacks permission
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorEnvelope' }
    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorEnvelope' }
    TransientError:
      description: Temporary failure — retry may succeed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorEnvelope' }
    OperatorActionRequired:
      description: Administrator must resolve before the operation can succeed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorEnvelope' }

  parameters:
    limitParam:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    cursorParam:
      name: cursor
      in: query
      schema:
        type: string

paths:
  # ============================== AUTH ==============================
  /auth/login:
    post:
      operationId: login
      security: []
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  detail:
                    type: string

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusOK'

  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusOK'

  # ============================== ME ==============================
  /me:
    get:
      operationId: getMe
      tags: [me]
      responses:
        "200":
          description: Current user info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
    patch:
      operationId: updateMe
      tags: [me]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeUpdateRequest'
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
    delete:
      operationId: deleteMe
      tags: [me]
      responses:
        "200":
          description: Account deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusOK'

  # ============================== API KEYS ==============================
  /me/api-keys:
    get:
      operationId: listMyAPIKeys
      tags: [api-keys]
      responses:
        "200":
          description: List of API keys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/APIKey'
    post:
      operationId: createAPIKey
      tags: [api-keys]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/APIKeyCreate'
      responses:
        "201":
          description: API key created (secret shown once)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKeyCreateResponse'

  /me/api-keys/{id}:
    delete:
      operationId: deleteAPIKey
      tags: [api-keys]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: API key revoked

  # ============================== ME S3 KEYS ==============================
  /me/s3-keys:
    get:
      operationId: listMyS3Keys
      tags: [s3-keys]
      responses:
        "200":
          description: List of S3 keys across all projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/S3Key'
    post:
      operationId: createMyS3Key
      tags: [s3-keys]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/S3KeyCreate'
      responses:
        "201":
          description: S3 key created (secret shown once)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/S3KeyCreateResponse'

  /me/s3-keys/{id}:
    delete:
      operationId: deleteMyS3Key
      tags: [s3-keys]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: S3 key revoked

  # ============================== PROJECTS ==============================
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      parameters:
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/cursorParam'
      responses:
        "200":
          description: Paginated list of projects
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'
