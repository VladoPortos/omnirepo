<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OmniRepo</title>
  <script>
    // Apply saved theme preference before first paint to avoid FOUC
    (function() {
      var theme = localStorage.getItem('omnirepo-theme');
      if (theme === 'light') {
        document.documentElement.classList.remove('dark');
      }
    })();
  </script>
</head>
<body class="bg-background text-foreground">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
